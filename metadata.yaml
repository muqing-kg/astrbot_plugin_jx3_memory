name: astrbot_plugin_jx3_memory
display_name: 剑网3数据库
short_desc: 聊天里提到剑网3的东西时，把正确的含义递给模型，让它别瞎编。
desc: "本地记忆库覆盖剑网3的物品、任务、成就、副本首领、心法门派、奇遇与黑话术语，共 22 万条词条。监听大模型请求，只在当前消息或最近几条对话里命中词条时才注入对应的正确含义：命中就注入，没命中一个字都不加。注入块只对本次请求生效，不写进对话历史，也不占系统提示。"
version: 0.1.0
astrbot_version: ">=4.29.0"
author: 沐倾
repo: https://github.com/muqing-kg/astrbot_plugin_jx3_memory
tags:
